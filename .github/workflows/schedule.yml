on:
  schedule:
  - cron: 0 1 * * 5
name: GraphQL schema update
permissions:
  contents: read
jobs:
  updateSchema:
    name: Update schema
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@7
    - name: Update schema
      uses: ./actions/schema-up
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
